<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jornada</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background-color:#121214;color:#e1e1e6;padding:20px;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden;}
.workspace{display:flex;gap:25px;max-width:1300px;width:100%;height:calc(100vh - 40px);justify-content:center;align-items:stretch;}
.campo-futbol{width:100%;max-width:650px;aspect-ratio:3/4;border:4px solid #fff;border-radius:12px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:120px 0 15px 0;overflow:hidden;background:linear-gradient(90deg,#226e26 0%,#226e26 10%,#29802d 10%,#29802d 20%,#226e26 20%,#226e26 30%,#29802d 30%,#29802d 40%,#226e26 40%,#226e26 50%,#29802d 50%,#29802d 60%,#226e26 60%,#226e26 70%,#29802d 70%,#29802d 80%,#226e26 80%,#226e26 90%,#29802d 90%,#29802d 100%),radial-gradient(circle,rgba(255,255,255,0.15) 0%,rgba(0,0,0,0) 70%);background-blend-mode:overlay;}
.campo-futbol::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background-color:rgba(255,255,255,0.7);}.campo-futbol::after{content:'';position:absolute;top:50%;left:50%;width:120px;height:120px;border:2px solid rgba(255, 255, 255, 0.7);border-radius:50%;transform:translate(-50%,-50%);}
.panel-control-interno{position:absolute;top:15px;left:0;width:100%;display:flex;flex-direction:column;align-items:center;z-index:20;pointer-events:auto;padding:0 15px;}
.cabecera-jornada-contenedor{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:12px;text-align:center;width:100%;}
.cabecera-jornada-contenedor h1{color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,0.8);font-size:26px;font-weight:bold;margin:0;}
.input-selector-jornada{width:52px;padding:4px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);background-color:rgba(18,18,20,0.6);color:#4caf50;font-size:20px;font-weight:bold;text-align:center;outline:none;}
.config-container{display:flex;gap:15px;background-color:rgba(18,18,20,0.5)!important;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);width:100%;justify-content:center;align-items:center;}
.config-group{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:bold;color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,0.8);}.config-group select,.config-group input{padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.3);background-color:#202024;color:white;font-weight:bold;font-size:12px;}
.area-penal{position:absolute;left:50%;transform:translateX(-50%);width:62%;height:16%;border:2px solid rgba(255,255,255,0.7);z-index:1;}.area-top{top:0;border-top:none;}.area-bottom{bottom:0;border-bottom:none;}.linea-jugadores{display:flex;justify-content:space-around;align-items:center;width:100%;height:23%;position:relative;z-index:2;}
.jugador-card{display:flex;flex-direction:column;align-items:center;width:105px;background-color:rgba(18,18,20,0.85);padding:6px;border-radius:8px;border:1px solid #323238;box-shadow:0 4px 10px rgba(0,0,0,0.3);position:relative;transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;}
.jugador-card.tarjeta-dorada, .suplente-fila.tarjeta-dorada {background-color: rgba(218, 165, 32, 0.25) !important; border: 2px solid #ffd700 !important; box-shadow: 0 0 12px rgba(255, 215, 0, 0.5) !important;}
.jugador-card.tarjeta-roja, .suplente-fila.tarjeta-roja {background-color: rgba(255, 68, 68, 0.25) !important; border: 1px solid #ff4444 !important; box-shadow: none !important;}
.jugador-card.tarjeta-dorada.tarjeta-roja, .suplente-fila.tarjeta-dorada.tarjeta-roja {background-color: rgba(180, 20, 20, 0.7) !important; border: 3px dashed #ffd700 !important; box-shadow: 0 0 16px rgba(255, 215, 0, 0.9) !important;}
.btn-mvp-estrella, .btn-no-alineado{background:none;border:none;color:#7c7c8a;font-size:12px;cursor:pointer;outline:none;padding:0 1px;transition:transform 0.1s;}
.btn-mvp-estrella:hover, .btn-no-alineado:hover{transform:scale(1.25);}
.btn-mvp-estrella.activo{color:#ffeb3b;text-shadow:0 0 6px rgba(255,235,59,0.8);}
.btn-no-alineado.activo{color:#ff4444;text-shadow:0 0 6px rgba(255,68,68,0.8);}
.nombre-container{display:flex;align-items:center;width:100%;gap:1px;}
.tarjeta-dorada .nombre-container span { color: #ffffff !important; font-weight: bold; }
.tarjeta-dorada .contador-onces { color: #4caf50 !important; font-weight: bold; }
.jugador-input{flex-grow:1;width:10px;background:transparent;border:none;border-bottom:1px solid #44444e;color:#fff;font-size:11px;text-align:center;padding:2px 0;}.jugador-input:focus{outline:none;border-bottom-color:#4caf50;}
.contador-onces{width:15px;font-size:11px;background:transparent;border:none;color:#4caf50;font-weight:bold;text-align:center;outline:none;-moz-appearance:textfield;}.contador-onces::-webkit-outer-spin-button,.contador-onces::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}.foto-container{width:56px;height:56px;background-color:#29292e;border-radius:50%;border:2px solid #fff;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;margin:4px 0;background-size:cover;background-position:center;background-repeat:no-repeat;}.btn-subir-foto{font-size:18px;color:#7c7c8a;z-index:1;pointer-events:none;}
.equipo-container{display:flex;align-items:center;gap:4px;width:100%;margin-bottom:4px;}.escudo-miniatura{width:18px;height:18px;background-color:#323238;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background-size:contain;background-position:center;background-repeat:no-repeat;}.select-equipo{flex-grow:1;width:10px;background-color:#202024;color:#fff;border:1px solid #323238;border-radius:4px;font-size:10px;padding:2px;outline:none;}
.pts-container{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;}.jugador-pts{width:50px;background-color:#121214;border:1px solid #323238;color:#ffeb3b;font-weight:bold;font-size:11px;text-align:center;border-radius:4px;}.label-pts{font-size:11px;color:#ffeb3b;font-weight:bold;}
.panel-suplentes{width:440px;background-color:#1a1a1e;padding:15px;border-radius:12px;border:1px solid #29292e;display:flex;flex-direction:column;overflow:hidden;}.panel-suplentes h2{font-size:18px;margin-bottom:12px;border-bottom:2px solid #4caf50;padding-bottom:6px;color:#4caf50;flex-shrink:0;}
/* CAMBIO CLAVE: BANQUILLO RE-ESTRUCTURADO ESTRICTAMENTE A 2 COLUMNAs */
.lista-suplentes{display:grid;grid-template-columns:repeat(2, 1fr);gap:6px;flex-grow:1;align-content:start;overflow-y:auto;height:52%;}
.recuento-equipos-container{margin-top:15px;background-color:#202024;border:1px solid #29292e;border-radius:8px;padding:10px;height:40%;display:flex;flex-direction:column;flex-shrink:0;}
.cabecera-recuento-dinamica{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #323238;padding-bottom:5px;margin-bottom:6px;}
.cabecera-recuento-dinamica h3{font-size:14px;color:#e1e1e6;font-weight:bold;}
.btn-calcular-tabla{background-color:#4caf50;color:white;border:none;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:bold;cursor:pointer;transition:background 0.2s;}.btn-calcular-tabla:hover{background-color:#45a049;}
.lista-recuento-datos{display:flex;flex-direction:column;gap:4px;overflow-y:auto;flex-grow:1;max-height:100%;}
.recuento-fila-item{display:flex;align-items:center;gap:6px;background-color:#1a1a1e;padding:5px 10px;border-radius:4px;border:1px solid #29292e;}
.recuento-puesto{font-weight:bold;color:#ffeb3b;width:24px;font-size:11px;}
.recuento-barra-visual{background-color:#4caf50;color:#fff;font-weight:bold;font-size:11px;padding:2px 6px;border-radius:3px;margin-left:auto;}
.marcador-total-campo{position:absolute;left:15px;bottom:15px;z-index:10;display:flex;align-items:center;gap:6px;background-color:rgba(18,18,20,0.85);padding:8px 12px;border-radius:6px;border:1px solid #4caf50;box-shadow:0 4px 10px rgba(0,0,0,0.5);}
.marcador-total-campo span{font-size:12px;font-weight:bold;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.8);}
.marcador-total-campo .caja-num{background-color:#121214;border:1px solid #323238;color:#ffeb3b;font-weight:bold;font-size:14px;padding:3px 8px;border-radius:4px;min-width:45px;text-align:center;}
.suplente-fila{display:flex;flex-direction:column;align-items:center;background-color:#202024;padding:6px;border-radius:8px;border:1px solid #29292e;justify-content:space-between;position:relative;transition: background-color 0.2s, border-color 0.2s, box-shadow 0.2s;}.suplente-fila .foto-container{width:40px;height:40px;margin:2px 0;}.suplente-datos{display:flex;flex-direction:column;gap:3px;width:100%;}.suplente-row-inline{display:flex;gap:4px;align-items:center;width:100%;}
.select-posicion-suplente{font-size:10px;background-color:#e05320;color:white;border:none;padding:2px;border-radius:4px;font-weight:bold;flex-shrink:0;}
.btn-reset{padding:6px 12px;border:1px solid rgba(255,68,68,0.4);border-radius:4px;background-color:#202024;color:#ff4444;font-weight:bold;cursor:pointer;font-size:12px;transition:background 0.2s, color 0.2s, transform 0.1s;margin-left:5px;}.btn-reset:hover{background-color:#ff4444;color:white;transform:scale(1.03);}.btn-reset:active{transform:scale(0.97);}
@media (max-width:950px){body{overflow:auto;height:auto;}.workspace{flex-direction:column;align-items:center;height:auto;}.panel-suplentes{width:100%;max-width:650px;}.lista-suplentes{grid-template-columns:repeat(2, 1fr);}}
</style></head>
<body><input type="file" id="globalImageInput" accept="image/*" style="display: none;"><div class="workspace"><div class="campo-futbol"><div class="panel-control-interno"><div class="cabecera-jornada-contenedor"><h1>Equipo Ideal Jornada</h1><input type="number" id="numeroJornadaInput" value="1" min="1" max="50" class="input-selector-jornada" oninput="cambiarJornadaManual()"></div><div class="config-container"><div class="config-group"><label>Sistema:</label><select id="formacionSelect" onchange="cambiarFormacion()"><option value="4-4-2">4 - 4 - 2</option><option value="4-3-3">4 - 3 - 3</option><option value="3-5-2">3 - 5 - 2</option><option value="5-3-2">5 - 3 - 2</option><option value="4-5-1">4 - 5 - 1</option></select></div><div class="config-group"><label>Suplentes:</label><!-- MODIFICACIÓN CLAVE: MÁXIMO BAJADO A 12 DE FORMA ESTRICTA --><input type="number" id="numSuplentesInput" value="7" min="0" max="12" onchange="actualizarNumeroSuplentes()"></div><button class="btn-reset" onclick="borrarTodo()">Borrar Todo</button></div></div><div class="area-penal area-top"></div><div class="linea-jugadores" id="linea-delanteros" style="margin-top: 55px;"></div><div class="linea-jugadores" id="linea-medios"></div><div class="linea-jugadores" id="linea-defensas"></div><div class="linea-jugadores" id="linea-portero"></div><div class="area-penal area-bottom"></div><div class="marcador-total-campo"><span>TOTAL:</span><div class="caja-num" id="marcadorSumaTotal">0</div></div></div><div class="panel-suplentes"><h2>Banquillo</h2><div class="lista-suplentes" id="listaSuplentes"></div><div class="recuento-equipos-container"><div class="cabecera-recuento-dinamica"><h3>Jugadores por Club</h3><button class="btn-calcular-tabla" onclick="calcularRecuentoEquipos()">Actualizar Tabla 🔄</button></div><div class="lista-recuento-datos" id="recuentoEquiposLista"></div></div></div></div><script>
const equipos=["Eibar","Oviedo","Las Palmas","Sporting","Osasuna","Recreativo","Marino","Levante","Cádiz","Real Unión","Lleida","Celta","Barcelona","Real Sociedad","Guadalajara","Coruxo","Alavés","Valencia","Huracán","Deportivo"];
function actualizarEscudoVisual(idCard){const select=document.querySelector(`[data-id="${idCard}"][data-tipo="equipo"]`);const divEscudo=document.querySelector(`[data-escudo-id="${idCard}"]`);if(select&&divEscudo)divEscudo.style.backgroundImage=`url('./Escudos/${select.value}.png')`;calcularRecuentoEquipos();}
function actualizarFotoJugador(idCard){const divFoto=document.querySelector(`[data-img-id="${idCard}"]`);if(!divFoto)return;const txtPlus=divFoto.querySelector('.btn-subir-foto');const inputNombre=document.querySelector(`[data-id="${idCard}"][data-tipo="nombre"]`);const nombre=inputNombre?inputNombre.value.trim():"";if(nombre!==""){const nombreFormateado=nombre.replace(/\s+/g,'_');divFoto.style.backgroundImage=`url('./Jugadores/${nombreFormateado}.webp')`;if(txtPlus)txtPlus.style.display='none';}else{divFoto.style.backgroundImage='none';if(txtPlus)txtPlus.style.display='block';}}

function verificarPuntosDorados(idCard){
    const inpPts = document.querySelector(`[data-id="${idCard}"][data-tipo="pts"]`);
    const tarjeta = inpPts ? inpPts.closest('.jugador-card, .suplente-fila') : null;
    if(!tarjeta) return;
    const valor = parseInt(inpPts.value) || 0;
    if(valor >= 16){ tarjeta.classList.add('tarjeta-dorada'); } else { tarjeta.classList.remove('tarjeta-dorada'); }
    sumarPuntosTitulares();
}

function sumarPuntosTitulares(){
    let suma = 0; document.querySelectorAll('.campo-futbol .jugador-pts').forEach(input => { const val = parseInt(input.value) || 0; suma += val; });
    const divMarcador = document.getElementById('marcadorSumaTotal'); if(divMarcador) divMarcador.innerText = suma;
}

function calcularRecuentoEquipos(){
    const conteo={};
    document.querySelectorAll('.workspace .select-equipo').forEach(select=>{
        const cardId = select.dataset.id; const inputNombre = document.querySelector(`[data-id="${cardId}"][data-tipo="nombre"]`);
        if(inputNombre && inputNombre.value.trim() !== ""){
            const eq = select.value; if(!conteo[eq]) conteo[eq] = { titularesCampo: 0, total: 0, noAlineados: 0 };
            conteo[eq].total += 1;
            if(cardId.startsWith('tit_')) { conteo[eq].titularesCampo += 1; }
            const btnNoAl = document.querySelector(`[data-btn-noal="${cardId}"]`);
            if(btnNoAl && btnNoAl.classList.contains('activo')) { conteo[eq].noAlineados += 1; }
        }
    });
    const listaHtml = document.getElementById('recuentoEquiposLista'); if(!listaHtml) return; listaHtml.innerHTML = '';
    
    const ordenados = Object.entries(conteo).sort((a,b)=>{
        const jugadoresA = a[1].titularesCampo; const jugadoresB = b[1].titularesCampo;
        if (jugadoresB !== jugadoresA) { return jugadoresB - jugadoresA; }
        const pctA = (a[1].total - a[1].noAlineados) / a[1].total;
        const pctB = (b[1].total - b[1].noAlineados) / b[1].total;
        if (pctB !== pctA) { return pctB - pctA; }
        return a[0].localeCompare(b[0]);
    });

    let puestoActual = 1;
    ordenados.forEach(([equipo, datosClub], index)=>{
        if(index > 0){
            const previo = ordenados[index-1];
            const pctPrevio = (previo[1].total - previo[1].noAlineados) / previo[1].total;
            const pctActual = (datosClub.total - datosClub.noAlineados) / datosClub.total;
            if(datosClub.titularesCampo !== previo[1].titularesCampo || pctActual !== pctPrevio){ puestoActual = index + 1; }
        }
        const alineadosReales = datosClub.total - datosClub.noAlineados;
        const porcentaje = Math.round((alineadosReales / datosClub.total) * 100);
        const item = document.createElement('div');item.className='recuento-fila-item';
        const pto = document.createElement('span');pto.className='recuento-puesto';pto.innerText=`${puestoActual}º`;item.appendChild(pto);
        const esc = document.createElement('div');item.appendChild(esc);esc.className='escudo-miniatura';esc.style.backgroundImage=`url('./Escudos/${equipo}.png')`;
        const txt = document.createElement('span');item.appendChild(txt);txt.innerText=equipo;
        const bar = document.createElement('span');item.appendChild(bar);bar.className='recuento-barra-visual';
        bar.innerText = `${alineadosReales}/${datosClub.total} (${porcentaje}%)`; listaHtml.appendChild(item);
    });
}

function toggleMvp(idCard){
    const boton = document.querySelector(`[data-btn-mvp="${idCard}"]`);if(!boton) return;
    const yaActivo = boton.classList.contains('activo');
    document.querySelectorAll('.btn-mvp-estrella').forEach(b => { b.classList.remove('activo'); b.innerText = '☆'; });
    if(!yaActivo){ boton.classList.add('activo'); boton.innerText = '⭐'; }
    guardarDatos();
}

function toggleNoAlineado(idCard){
    const boton = document.querySelector(`[data-btn-noal="${idCard}"]`);if(!boton) return;
    const tarjeta = boton.closest('.jugador-card, .suplente-fila');
    if(boton.classList.contains('activo')){ 
        boton.classList.remove('activo'); boton.innerText = '▽'; if(tarjeta) tarjeta.classList.remove('tarjeta-roja');
    } else { 
        boton.classList.add('activo'); boton.innerText = '⬇️'; if(tarjeta) tarjeta.classList.add('tarjeta-roja');
    }
    calcularRecuentoEquipos(); guardarDatos();
}
function obtenerStorageKey(){ const j = document.getElementById('numeroJornadaInput').value || '1'; return 'save_jornada_num_' + j; }
function cambiarJornadaManual(){ const jNum = document.getElementById('numeroJornadaInput').value || '1'; localStorage.setItem('save_ultima_jornada_vista', jNum); cargarDatos(); }
function guardarDatos(){
    const jNum = document.getElementById('numeroJornadaInput').value || '1';
    const datos={jornada:jNum,formacion:document.getElementById('formacionSelect').value,numSuplentes:document.getElementById('numSuplentesInput').value,jugadores:[],mvpId:null,noAlineadosIds:[]};
    const mvpActivo = document.querySelector('.btn-mvp-estrella.activo');if(mvpActivo) datos.mvpId = mvpActivo.dataset.btnMvp;
    document.querySelectorAll('.btn-no-alineado.activo').forEach(b => { datos.noAlineadosIds.push(b.dataset.btnNoal); });
    document.querySelectorAll('.workspace input,.workspace select').forEach(el=>{const id=el.dataset.id;if(id){if(!datos.jugadores[id])datos.jugadores[id]={};datos.jugadores[id][el.dataset.tipo]=el.value;}});
    localStorage.setItem(obtenerStorageKey(),JSON.stringify(datos));
}
function cargarDatos(){
    const jNum = document.getElementById('numeroJornadaInput').value || '1'; const raw = localStorage.getItem('save_jornada_num_' + jNum);
    const selectFormacion = document.getElementById('formacionSelect');
    const formacionActual = raw ? JSON.parse(raw).formacion : (selectFormacion ? selectFormacion.value : '4-4-2');
    if(selectFormacion && raw) selectFormacion.value = formacionActual;
    cambiarFormacion(false); actualizarNumeroSuplentes(false);
    document.querySelectorAll('.btn-mvp-estrella').forEach(b => { b.classList.remove('activo'); b.innerText = '☆'; });
    document.querySelectorAll('.btn-no-alineado').forEach(b => { b.classList.remove('activo'); b.innerText = '▽'; });
    document.querySelectorAll('.jugador-card, .suplente-fila').forEach(t => { t.classList.remove('tarjeta-dorada','tarjeta-roja'); });
    if(!raw){ calcularRecuentoEquipos(); sumarPuntosTitulares(); return; }
    const datos=JSON.parse(raw); document.getElementById('numSuplentesInput').value = datos.numSuplentes; actualizarNumeroSuplentes(false);
    Object.keys(datos.jugadores).forEach(id=>{
        const J=datos.jugadores[id];const txt=document.querySelector(`[data-id="${id}"][data-tipo="nombre"]`);if(txt){txt.value=J.nombre||'';}
        const eq=document.querySelector(`[data-id="${id}"][data-tipo="equipo"]`);if(eq){eq.value=J.equipo||'Eibar'; actualizarEscudoVisual(id);}
        const pts=document.querySelector(`[data-id="${id}"][data-tipo="pts"]`);if(pts) { pts.value=J.pts||''; verificarPuntosDorados(id); }
        const pos=document.querySelector(`[data-id="${id}"][data-tipo="posicion"]`);if(pos)pos.value=J.posicion||'POR';
        const onc=document.querySelector(`[data-id="${id}"][data-tipo="onces"]`);if(onc)onc.value=J.onces||'0'; actualizarFotoJugador(id);
    });
    if(datos.mvpId){ const btn = document.querySelector(`[data-btn-mvp="${datos.mvpId}"]`); if(btn){ btn.classList.add('activo'); btn.innerText = '⭐'; } }
    if(datos.noAlineadosIds){ datos.noAlineadosIds.forEach(id => { const btn = document.querySelector(`[data-btn-noal="${id}"]`); if(btn){ btn.classList.add('activo'); btn.innerText = '⬇️'; const tarjeta = btn.closest('.jugador-card, .suplente-fila'); if(tarjeta) tarjeta.classList.add('tarjeta-roja'); } }); }
    document.querySelectorAll('.workspace .jugador-pts').forEach(input => { const cardId = input.dataset.id; if(cardId) verificarPuntosDorados(cardId); });
    calcularRecuentoEquipos(); sumarPuntosTitulares();
}
function borrarTodo(){if(confirm('¿Borrar?')){localStorage.removeItem(obtenerStorageKey());location.reload();}}
function crearTarjetaJugador(p,id,s=false){
    const c=document.createElement('div');c.className=s?'suplente-fila':'jugador-card';const nameContainer=document.createElement('div');nameContainer.className='nombre-container';
    if(!s){ const btnMvp = document.createElement('button');btnMvp.className = 'btn-mvp-estrella';btnMvp.innerText = '☆';btnMvp.dataset.btnMvp = id;btnMvp.onclick = function(e){ e.stopPropagation(); toggleMvp(id); }; nameContainer.appendChild(btnMvp); }
    const btnNoAl = document.createElement('button');btnNoAl.className = 'btn-no-alineado';btnNoAl.innerText = '▽';btnNoAl.dataset.btnNoal = id;btnNoAl.onclick = function(e){ e.stopPropagation(); toggleNoAlineado(id); };nameContainer.appendChild(btnNoAl);
    const inp=document.createElement('input');inp.type='text';inp.className='jugador-input';inp.placeholder=p;inp.dataset.id=id;inp.dataset.tipo='nombre';inp.oninput=function(){actualizarFotoJugador(id);guardarDatos();};
