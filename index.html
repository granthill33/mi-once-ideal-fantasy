<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Jornada</title><style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif;}body{background-color:#121214;color:#e1e1e6;padding:20px;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden;}
.workspace{display:flex;gap:25px;max-width:1300px;width:100%;height:calc(100vh - 40px);justify-content:center;align-items:stretch;}
.campo-futbol{width:100%;max-width:650px;aspect-ratio:3/4;border:4px solid #fff;border-radius:12px;position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:120px 0 15px 0;overflow:hidden;background:linear-gradient(90deg,#226e26 0%,#226e26 10%,#29802d 10%,#29802d 20%,#226e26 20%,#226e26 30%,#29802d 30%,#29802d 40%,#226e26 40%,#226e26 50%,#29802d 50%,#29802d 60%,#226e26 60%,#226e26 70%,#29802d 70%,#29802d 80%,#226e26 80%,#226e26 90%,#29802d 90%,#29802d 100%),radial-gradient(circle,rgba(255,255,255,0.15) 0%,rgba(0,0,0,0) 70%);background-blend-mode:overlay;}
.campo-futbol::before{content:'';position:absolute;top:50%;left:0;width:100%;height:2px;background-color:rgba(255,255,255,0.7);}.campo-futbol::after{content:'';position:absolute;top:50%;left:50%;width:120px;height:120px;border:2px solid rgba(255, 255, 255, 0.7);border-radius:50%;transform:translate(-50%,-50%);}
.panel-control-interno{position:absolute;top:15px;left:0;width:100%;display:flex;flex-direction:column;align-items:center;z-index:20;pointer-events:auto;padding:0 15px;}
.cabecera-jornada-contenedor{display:flex;justify-content:center;align-items:center;gap:12px;margin-bottom:12px;text-align:center;width:100%;}
.cabecera-jornada-contenedor h1{color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,0.8);font-size:26px;font-weight:bold;margin:0;}
.input-selector-jornada{width:52px;padding:4px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);background-color:rgba(18,18,20,0.6);color:#4caf50;font-size:20px;font-weight:bold;text-align:center;outline:none;}
.config-container{display:flex;gap:15px;background-color:rgba(18,18,20,0.5)!important;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.2);width:100%;justify-content:center;}
.config-group{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:bold;color:#ffffff;text-shadow:0 1px 3px rgba(0,0,0,0.8);}.config-group select,.config-group input{padding:6px;border-radius:4px;border:1px solid rgba(255,255,255,0.3);background-color:#202024;color:white;font-weight:bold;font-size:12px;}
.area-penal{position:absolute;left:50%;transform:translateX(-50%);width:62%;height:16%;border:2px solid rgba(255,255,255,0.7);z-index:1;}.area-top{top:0;border-top:none;}.area-bottom{bottom:0;border-bottom:none;}.linea-jugadores{display:flex;justify-content:space-around;align-items:center;width:100%;height:23%;position:relative;z-index:2;}
.jugador-card{display:flex;flex-direction:column;align-items:center;width:105px;background-color:rgba(18,18,20,0.85);padding:6px;border-radius:8px;border:1px solid #323238;box-shadow:0 4px 10px rgba(0,0,0,0.3);position:relative;}
.btn-mvp-estrella{background:none;border:none;color:#7c7c8a;font-size:13px;cursor:pointer;outline:none;padding:0 2px;transition:transform 0.1s;}.btn-mvp-estrella:hover{transform:scale(1.2);}.btn-mvp-estrella.activo{color:#ffeb3b;text-shadow:0 0 6px rgba(255,235,59,0.8);}
.nombre-container{display:flex;align-items:center;width:100%;gap:1px;}.jugador-input{flex-grow:1;width:10px;background:transparent;border:none;border-bottom:1px solid #44444e;color:#fff;font-size:11px;text-align:center;padding:2px 0;}.jugador-input:focus{outline:none;border-bottom-color:#4caf50;}
.contador-onces{width:16px;font-size:11px;background:transparent;border:none;color:#4caf50;font-weight:bold;text-align:center;outline:none;-moz-appearance:textfield;}.contador-onces::-webkit-outer-spin-button,.contador-onces::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}.foto-container{width:56px;height:56px;background-color:#29292e;border-radius:50%;border:2px solid #fff;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden;margin:4px 0;background-size:cover;background-position:center;background-repeat:no-repeat;}.btn-subir-foto{font-size:18px;color:#7c7c8a;z-index:1;pointer-events:none;}
.equipo-container{display:flex;align-items:center;gap:4px;width:100%;margin-bottom:4px;}.escudo-miniatura{width:18px;height:18px;background-color:#323238;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background-size:contain;background-position:center;background-repeat:no-repeat;}.select-equipo{flex-grow:1;width:10px;background-color:#202024;color:#fff;border:1px solid #323238;border-radius:4px;font-size:10px;padding:2px;outline:none;}
.pts-container{display:flex;align-items:center;justify-content:center;gap:4px;width:100%;}.jugador-pts{width:50px;background-color:#121214;border:1px solid #323238;color:#ffeb3b;font-weight:bold;font-size:11px;text-align:center;border-radius:4px;}.label-pts{font-size:11px;color:#ffeb3b;font-weight:bold;}.panel-suplentes{width:440px;background-color:#1a1a1e;padding:15px;border-radius:12px;border:1px solid #29292e;display:flex;flex-direction:column;overflow:hidden;}.panel-suplentes h2{font-size:18px;margin-bottom:12px;border-bottom:2px solid #4caf50;padding-bottom:6px;color:#4caf50;flex-shrink:0;}
.lista-suplentes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;flex-grow:1;align-content:start;overflow-y:auto;height:60%;}
/* ESTILOS DE LA NUEVA SECCIÓN DE RECUENTO POR EQUIPOS */
.recuento-equipos-container{margin-top:15px;background-color:#202024;border:1px solid #29292e;border-radius:8px;padding:10px;height:32%;display:flex;flex-direction:column;flex-shrink:0;}
.recuento-equipos-container h3{font-size:14px;color:#e1e1e6;border-bottom:1px solid #323238;padding-bottom:4px;margin-bottom:6px;font-weight:bold;}
.lista-recuento-datos{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;overflow-y:auto;font-size:12px;}
.recuento-fila-item{display:flex;align-items:center;gap:6px;background-color:#1a1a1e;padding:4px 8px;border-radius:4px;border:1px solid #29292e;}
.recuento-barra-visual{background-color:#4caf50;color:#fff;font-weight:bold;font-size:10px;padding:2px 5px;border-radius:3px;margin-left:auto;}
.suplente-fila{display:flex;flex-direction:column;align-items:center;background-color:#202024;padding:6px;border-radius:8px;border:1px solid #29292e;justify-content:space-between;position:relative;}.suplente-fila .foto-container{width:40px;height:40px;margin:2px 0;}.suplente-datos{display:flex;flex-direction:column;gap:3px;width:100%;}.suplente-row-inline{display:flex;gap:4px;align-items:center;width:100%;}
.select-posicion-suplente{font-size:10px;background-color:#e05320;color:white;border:none;padding:2px;border-radius:4px;font-weight:bold;flex-shrink:0;}.btn-reset{padding:6px 10px;border:1px solid rgba(255,255,255,0.3);border-radius:4px;background-color:rgba(224,83,32,0.85);color:white;font-weight:bold;cursor:pointer;font-size:12px;}
@media (max-width:950px){body{overflow:auto;height:auto;}.workspace{flex-direction:column;align-items:center;height:auto;}.panel-suplentes{width:100%;max-width:650px;}.lista-suplentes{grid-template-columns:repeat(auto-fit,minmax(130px,1fr));}}
</style></head>
<body><input type="file" id="globalImageInput" accept="image/*" style="display: none;"><div class="workspace"><div class="campo-futbol"><div class="panel-control-interno"><div class="cabecera-jornada-contenedor"><h1>Equipo Ideal Jornada</h1><input type="number" id="numeroJornadaInput" value="1" min="1" max="50" class="input-selector-jornada" oninput="guardarDatos()"></div><div class="config-container"><div class="config-group"><label>Sistema:</label><select id="formacionSelect" onchange="cambiarFormacion()"><option value="4-4-2">4 - 4 - 2</option><option value="4-3-3">4 - 3 - 3</option><option value="3-5-2">3 - 5 - 2</option><option value="5-3-2">5 - 3 - 2</option><option value="4-5-1">4 - 5 - 1</option></select></div><div class="config-group"><label>Suplentes:</label><input type="number" id="numSuplentesInput" value="7" min="0" max="25" onchange="actualizarNumeroSuplentes()"></div><button class="btn-reset" onclick="borrarTodo()">Borrar Todo</button></div></div><div class="area-penal area-top"></div><div class="linea-jugadores" id="linea-delanteros" style="margin-top: 55px;"></div><div class="linea-jugadores" id="linea-medios"></div><div class="linea-jugadores" id="linea-defensas"></div><div class="linea-jugadores" id="linea-portero"></div><div class="area-penal area-bottom"></div></div><div class="panel-suplentes"><h2>Banquillo</h2><div class="lista-suplentes" id="listaSuplentes"></div><!-- NUEVA SECCIÓN DE RECUENTO: SE UBICA DEBAJO DEL BANQUILLO DE FORMA SIMÉTRICA --><div class="recuento-equipos-container"><h3>Jugadores por Club</h3><div class="lista-recuento-datos" id="recuentoEquiposLista"></div></div></div></div>
<script>
// version 3 con recuento automatico por equipos
const equipos=["Eibar","Oviedo","Las Palmas","Sporting","Osasuna","Recreativo","Marino","Levante","Cádiz","Real Unión","Lleida","Celta","Barcelona","Real Sociedad","Guadalajara","Coruxo","Alavés","Valencia","Huracán","Deportivo"];
function actualizarEscudoVisual(idCard){const select=document.querySelector(`[data-id="${idCard}"][data-tipo="equipo"]`);const divEscudo=document.querySelector(`[data-escudo-id="${idCard}"]`);if(select&&divEscudo)divEscudo.style.backgroundImage=`url('./Escudos/${select.value}.png')`;calcularRecuentoEquipos();}
function actualizarFotoJugador(idCard){const divFoto=document.querySelector(`[data-img-id="${idCard}"]`);if(!divFoto)return;const txtPlus=divFoto.querySelector('.btn-subir-foto');const inputNombre=document.querySelector(`[data-id="${idCard}"][data-tipo="nombre"]`);const nombre=inputNombre?inputNombre.value.trim():"";if(nombre!==""){const nombreFormateado=nombre.replace(/\s+/g,'_');divFoto.style.backgroundImage=`url('./Jugadores/${nombreFormateado}.webp')`;if(txtPlus)txtPlus.style.display='none';}else{divFoto.style.backgroundImage='none';if(txtPlus)txtPlus.style.display='block';}}

function calcularRecuentoEquipos(){
    const conteo={};
    document.querySelectorAll('.select-equipo').forEach(select=>{
        const cardId = select.dataset.id;
        const inputNombre = document.querySelector(`[data-id="${cardId}"][data-tipo="nombre"]`);
        if(inputNombre && inputNombre.value.trim() !== ""){
            const eq = select.value;
            conteo[eq] = (conteo[eq] || 0) + 1;
        }
    });
    const listaHtml = document.getElementById('recuentoEquiposLista');
    if(!listaHtml) return;
    listaHtml.innerHTML = '';
    const ordenados = Object.entries(conteo).sort((a,b)=>b[1]-a[1]);
    ordenados.forEach(([equipo, num])=>{
        const item = document.createElement('div');item.className='recuento-fila-item';
        const esc = document.createElement('div');item.appendChild(esc);esc.className='escudo-miniatura';esc.style.backgroundImage=`url('./Escudos/${equipo}.png')`;
        const txt = document.createElement('span');item.appendChild(txt);txt.innerText=equipo;
        const bar = document.createElement('span');item.appendChild(bar);bar.className='recuento-barra-visual';bar.innerText=num;
        listaHtml.appendChild(item);
    });
}

function toggleMvp(idCard){
    const boton = document.querySelector(`[data-btn-mvp="${idCard}"]`);if(!boton) return;
    const yaActivo = boton.classList.contains('activo');
    document.querySelectorAll('.btn-mvp-estrella').forEach(b => { b.classList.remove('activo'); b.innerText = '☆'; });
    if(!yaActivo){ boton.classList.add('activo'); boton.innerText = '⭐'; }
    guardarDatos();
}

function guardarDatos(){
    const datos={jornada:document.getElementById('numeroJornadaInput').value,formacion:document.getElementById('formacionSelect').value,numSuplentes:document.getElementById('numSuplentesInput').value,jugadores:[],mvpId:null};
    const mvpActivo = document.querySelector('.btn-mvp-estrella.activo');if(mvpActivo) datos.mvpId = mvpActivo.dataset.btnMvp;
    document.querySelectorAll('.workspace input,.workspace select').forEach(el=>{const id=el.dataset.id;if(id){if(!datos.jugadores[id])datos.jugadores[id]={};datos.jugadores[id][el.dataset.tipo]=el.value;}});
    localStorage.setItem('save_jornada_v2',JSON.stringify(datos));
}

function cargarDatos(){
    const raw=localStorage.getItem('save_jornada_v2');if(!raw)return;const datos=JSON.parse(raw);
    if(datos.jornada) document.getElementById('numeroJornadaInput').value = datos.jornada;
    document.getElementById('formacionSelect').value=datos.formacion;document.getElementById('numSuplentesInput').value=datos.numSuplentes;
    cambiarFormacion(false);actualizarNumeroSuplentes(false);
    Object.keys(datos.jugadores).forEach(id=>{
        const J=datos.jugadores[id];const txt=document.querySelector(`[data-id="${id}"][data-tipo="nombre"]`);if(txt){txt.value=J.nombre||'';}
        const eq=document.querySelector(`[data-id="${id}"][data-tipo="equipo"]`);if(eq){eq.value=J.equipo||'Eibar';actualizarEscudoVisual(id);}
        const pts=document.querySelector(`[data-id="${id}"][data-tipo="pts"]`);if(pts)pts.value=J.pts||'';
        const pos=document.querySelector(`[data-id="${id}"][data-tipo="posicion"]`);if(pos)pos.value=J.posicion||'POR';
        const onc=document.querySelector(`[data-id="${id}"][data-tipo="onces"]`);if(onc)onc.value=J.onces||'0';actualizarFotoJugador(id);
    });
    if(datos.mvpId){ const btn = document.querySelector(`[data-btn-mvp="${datos.mvpId}"]`); if(btn){ btn.classList.add('activo'); btn.innerText = '⭐'; } }
    calcularRecuentoEquipos();
}
function borrarTodo(){if(confirm('¿Borrar historial?')){localStorage.removeItem('save_jornada_v2');location.reload();}}
function crearTarjetaJugador(p,id,s=false){
    const c=document.createElement('div');c.className=s?'suplente-fila':'jugador-card';const nameContainer=document.createElement('div');nameContainer.className='nombre-container';
    const btnMvp = document.createElement('button');btnMvp.className = 'btn-mvp-estrella';btnMvp.innerText = '☆';btnMvp.dataset.btnMvp = id;btnMvp.onclick = function(e){ e.stopPropagation(); toggleMvp(id); };
    const inp=document.createElement('input');inp.type='text';inp.className='jugador-input';inp.placeholder=p;inp.dataset.id=id;inp.dataset.tipo='nombre';inp.oninput=function(){actualizarFotoJugador(id);calcularRecuentoEquipos();guardarDatos();};
    const l1=document.createElement('span');l1.style.fontSize="11px";l1.style.color="#7c7c8a";l1.innerText="(";const inpOnces=document.createElement('input');inpOnces.type='number';inpOnces.className='contador-onces';inpOnces.value='0';inpOnces.min='0';inpOnces.dataset.id=id;inpOnces.dataset.tipo='onces';inpOnces.oninput=guardarDatos;const l2=document.createElement('span');l2.style.fontSize="11px";l2.style.color="#7c7c8a";l2.innerText=")";
    nameContainer.appendChild(btnMvp);nameContainer.appendChild(inp);nameContainer.appendChild(l1);nameContainer.appendChild(inpOnces);nameContainer.appendChild(l2);
    const f=document.createElement('div');f.className='foto-container';f.dataset.imgId=id;const txtF=document.createElement('span');txtF.className='btn-subir-foto';txtF.innerText='👤';f.appendChild(txtF);
    const d=document.createElement('div');d.className='suplente-datos';const eqContainer=document.createElement('div');eqContainer.className='equipo-container';const escudo=document.createElement('div');escudo.className='escudo-miniatura';escudo.dataset.escudoId=id;
    const selEq=document.createElement('select');selEq.className='select-equipo';selEq.dataset.id=id;selEq.dataset.tipo='equipo';selEq.onchange=function(){actualizarEscudoVisual(id);guardarDatos();};equipos.forEach(eq=>{const o=document.createElement('option');o.value=eq;o.innerText=eq;selEq.appendChild(o);});eqContainer.appendChild(escudo);eqContainer.appendChild(selEq);
    const ptsContainer=document.createElement('div');ptsContainer.className='pts-container';const inpPts=document.createElement('input');inpPts.type='number';inpPts.className='jugador-pts';inpPts.placeholder='0';inpPts.dataset.id=id;inpPts.dataset.tipo='pts';inpPts.oninput=guardarDatos;const labelPts=document.createElement('span');labelPts.className='label-pts';labelPts.innerText='pts';ptsContainer.appendChild(inpPts);ptsContainer.appendChild(labelPts);
    if(s){const row=document.createElement('div');row.className='suplente-row-inline';const selPos=document.createElement('select');selPos.className='select-posicion-suplente';selPos.dataset.id=id;selPos.dataset.tipo='posicion';selPos.onchange=guardarDatos;['POR','DEF','MED','DEL'].forEach(o=>{const opt=document.createElement('option');opt.value=o;opt.innerText=o;selPos.appendChild(opt);});row.appendChild(selPos);row.appendChild(nameContainer);d.appendChild(row);d.appendChild(eqContainer);d.appendChild(ptsContainer);c.appendChild(f);c.appendChild(d);return c;}else{c.appendChild(nameContainer);c.appendChild(f);c.appendChild(eqContainer);c.appendChild(ptsContainer);return c;}}
function cambiarFormacion(save=true){const f=document.getElementById('formacionSelect').value;const[def,med,del]=f.split('-').map(Number);document.getElementById('linea-delanteros').innerHTML='';document.getElementById('linea-medios').innerHTML='';document.getElementById('linea-defensas').innerHTML='';document.getElementById('linea-portero').innerHTML='';document.getElementById('linea-portero').appendChild(crearTarjetaJugador('Portero','tit_por'));for(let i=0;i<def;i++)document.getElementById('linea-defensas').appendChild(crearTarjetaJugador('Defensa','tit_def_'+i));for(let i=0;i<med;i++)document.getElementById('linea-medios').appendChild(crearTarjetaJugador('Medio','tit_med_'+i));for(let i=0;i<del;i++)document.getElementById('linea-delanteros').appendChild(crearTarjetaJugador('Delantero','tit_del_'+i));document.querySelectorAll('.select-equipo').forEach(select=>{const id=select.dataset.id;actualizarEscudoVisual(id);actualizarFotoJugador(id);});if(save)guardarDatos();}
function actualizarNumeroSuplentes(save=true){const l=document.getElementById('listaSuplentes');l.innerHTML='';let c=parseInt(document.getElementById('numSuplentesInput').value);if(isNaN(c)||c<0)c=0;if(c>25)c=25;for(let i=1;i<=c;i++){const cardComp=crearTarjetaJugador(`Sup ${i}`,`sup_${i}`,true);l.appendChild(cardComp);actualizarEscudoVisual(`sup_${i}`);actualizarFotoJugador(`sup_${i}`);}if(save)guardarDatos();}
cambiarFormacion(false);actualizarNumeroSuplentes(false);cargarDatos();
</script></body></html>
